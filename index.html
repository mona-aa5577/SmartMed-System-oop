<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMed - نظام الصندوق الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-pink: #ff69b4; --bg-dark: #121212; --card-bg: #1e1e1e; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 10px; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); z-index: 1000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        .container { max-width: 600px; margin: auto; padding-bottom: 50px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        h1, h2, h3 { color: var(--main-pink); margin-bottom: 10px; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; font-family: 'Cairo'; }
        label { font-size: 0.8rem; color: var(--main-pink); display: block; margin-top: 10px; font-weight: bold; }
        
        button { width: 100%; padding: 12px; background: var(--main-pink); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Cairo'; }

        .alert-box { background: rgba(255, 105, 180, 0.2); border: 2px solid var(--main-pink); padding: 15px; border-radius: 10px; text-align: center; display: none; margin-bottom: 15px; animation: glow 1s infinite alternate; }
        @keyframes glow { from {box-shadow: 0 0 5px var(--main-pink);} to {box-shadow: 0 0 20px var(--main-pink);} }

        .days-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #252525; padding: 10px; border-radius: 8px; }
        .day-label { font-size: 0.65rem; color: #fff; display: flex; align-items: center; gap: 3px; }
        .day-label input { width: auto; margin: 0; }

        .system-monitor { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 15px; color: #aaa; background: #1a1a1a; padding: 8px 12px; border-radius: 20px; }
        .dot { height: 8px; width: 8px; background: #00ff00; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff00; }

        .med-item { border-right: 5px solid var(--main-pink); display: flex; justify-content: space-between; align-items: center; }
        .stop-btn { width: auto; background: #c0392b; padding: 5px 12px; font-size: 0.75rem; }

        @media (min-width: 601px) { .days-container { grid-template-columns: repeat(7, 1fr); } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div style="font-size: 50px;">🏥</div>
    <h2>دخول المريض</h2>
    <input type="text" id="userNameInput" placeholder="اسم المريض...">
    <button onclick="login()">دخول</button>
</div>

<div class="container" id="mainContent" style="display:none;">
    <div class="system-monitor">
        <span><span class="dot"></span> SmartBox: Active</span>
        <span id="currentTime"></span>
    </div>

    <div class="card">
        <h3>👤 الملف الشخصي: <span id="displayUserName" style="color:white"></span></h3>
    </div>

    <div id="alertMsg" class="alert-box"></div>

    <div class="card">
        <h3>📅 برمجة الصندوق الذكي</h3>
        
        <label>اسم الدواء:</label>
        <input type="text" id="medName" placeholder="مثلاً: دواء السكر">
        
        <label>وقت الجرعة:</label>
        <input type="time" id="medTime">

        <label>الفترة الزمنية (من - إلى):</label>
        <div style="display: flex; gap: 10px;">
            <input type="date" id="startDate" value="2026-05-11">
            <input type="date" id="endDate" value="2027-05-11">
        </div>

        <label>أيام التكرار:</label>
        <div class="days-container">
            <label class="day-label"><input type="checkbox" class="day-check" value="الأحد"> أحد</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="الاثنين"> اثنين</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="الثلاثاء"> ثلاثاء</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="الأربعاء"> أربعاء</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="الخميس"> خميس</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="الجمعة"> جمعة</label>
            <label class="day-label"><input type="checkbox" class="day-check" value="السبت"> سبت</label>
        </div>

        <button onclick="scheduleMedication()">حفظ في الذاكرة</button>
    </div>

    <div id="medicineList"></div>
</div>

<script>
    let scheduledMeds = [];

    function login() {
        const name = document.getElementById('userNameInput').value;
        if(name) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('displayUserName').innerText = name;
        }
    }

    function scheduleMedication() {
        const med = document.getElementById('medName').value;
        const time = document.getElementById('medTime').value;
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        let days = [];
        document.querySelectorAll('.day-check:checked').forEach(d => days.push(d.value));

        if(med && time && days.length > 0) {
            scheduledMeds.push({ name: med, time: time, days: days, start: new Date(start), end: new Date(end) });

            const list = document.getElementById('medicineList');
            const item = document.createElement('div');
            item.className = 'card med-item';
            item.innerHTML = `
                <div>
                    <h4 style="margin:0; color:var(--main-pink)">${med}</h4>
                    <p style="font-size:0.7rem; color:#aaa; margin:5px 0;">⏰ ${time} | 📅 من ${start} إلى ${end}<br>أيام: ${days.join('، ')}</p>
                </div>
                <button class="stop-btn" onclick="this.parentElement.remove()">إيقاف</button>
            `;
            list.prepend(item);
            alert("✅ تمت الجدولة بنجاح");
        } else {
            alert("تأكد من إدخال كافة البيانات والأيام");
        }
    }

    setInterval(() => {
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const daysArr = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const currentDay = daysArr[now.getDay()];

        document.getElementById('currentTime').innerText = now.toLocaleTimeString('ar-SA');

        scheduledMeds.forEach((med) => {
            // فحص: هل التاريخ الحالي بين البداية والنهاية؟ وهل اليوم والوقت مطابقان؟
            if (now >= med.start && now <= med.end && med.time === currentTime && med.days.includes(currentDay)) {
                const box = document.getElementById('alertMsg');
                box.style.display = 'block';
                box.innerHTML = `🔔 موعد دواء ${med.name} الآن!`;
            }
        });
    }, 1000);
</script>
</body>
</html>
